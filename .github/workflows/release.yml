name: Release public package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate package
        run: python scripts/validate_public_package.py

      - name: Build release archive
        run: |
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix=cyber-age-sop/ \
            --output="dist/cyber-age-sop-${GITHUB_REF_NAME}.tar.gz" \
            HEAD

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/cyber-age-sop-${GITHUB_REF_NAME}.tar.gz" \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
