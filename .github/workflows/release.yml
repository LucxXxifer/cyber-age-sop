name: Release public package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate package
        run: python scripts/validate_public_package.py

      - name: Validate implementation readiness
        run: python scripts/validate_implementation_readiness.py

      - name: Build release archives
        run: |
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix=cyber-age-sop/ \
            --output="dist/cyber-age-sop-${GITHUB_REF_NAME}.tar.gz" \
            HEAD
          package_dir="$(mktemp -d)"
          cp -R skills/cyber-age-sop "${package_dir}/cyber-age-sop"
          cp LICENSE NOTICE "${package_dir}/cyber-age-sop/"
          (
            cd "${package_dir}"
            zip -qr "${GITHUB_WORKSPACE}/dist/cyber-age-sop-${GITHUB_REF_NAME}.zip" cyber-age-sop
          )
          rm -rf "${package_dir}"
          (
            cd dist
            sha256sum "cyber-age-sop-${GITHUB_REF_NAME}.tar.gz" "cyber-age-sop-${GITHUB_REF_NAME}.zip" > SHA256SUMS.txt
          )

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          notes_flags=(--generate-notes)
          if [[ -f "docs/releases/${GITHUB_REF_NAME}.md" ]]; then
            notes_flags=(--notes-file "docs/releases/${GITHUB_REF_NAME}.md")
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "dist/cyber-age-sop-${GITHUB_REF_NAME}.tar.gz" \
            "dist/cyber-age-sop-${GITHUB_REF_NAME}.zip" \
            "dist/SHA256SUMS.txt" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            "${notes_flags[@]}" \
            "${release_flags[@]}"
